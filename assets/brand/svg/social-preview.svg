<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-label="agent-mailbox — Mailbox + Wake system for agent teams">
  <title>agent-mailbox</title>
  <rect width="1280" height="640" fill="#F7F8FA"/>

  <!-- 右侧水印：放大的 mark（极低透明度，做质感） -->
  <g opacity="0.055" transform="translate(812 128) scale(7)">
    <rect x="6" y="18" width="32" height="23" rx="3.5" stroke="#1D2026" stroke-width="3.2"/>
    <path d="M7.4 21.2 22 31.6 36.6 21.2" stroke="#1D2026" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M29.5 18A8.5 8.5 0 0 1 38 9.5" stroke="#1D2026" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M23 18A15 15 0 0 1 38 3" stroke="#1D2026" stroke-width="3.2" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- 徽章 -->
  <g transform="translate(96 196) scale(2.9167)">
    <rect width="48" height="48" rx="11" fill="#4A6FA5"/>
    <rect x="8.5" y="14" width="31" height="21" rx="3.5" stroke="#FFFFFF" stroke-width="3.6"/>
    <path d="M10 16.9 24 26 38 16.9" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- 文字 -->
  <text x="286" y="272" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="700" letter-spacing="-1.2" fill="#1D2026">agent<tspan fill="#4A6FA5">-mailbox</tspan></text>
  <text x="288" y="322" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="600" fill="#4A6FA5">Mailbox + Wake system for agent teams</text>
  <text x="288" y="362" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="23" fill="#6E7585">One stdio MCP server · one JSON file per message · zero daemons</text>

  <!-- 四个小标签 -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#5A6172">
    <rect x="96" y="418" width="216" height="46" rx="23" fill="#FFFFFF" stroke="#E3E6EC"/>
    <text x="118" y="447">zero-dependency</text>
    <rect x="328" y="418" width="166" height="46" rx="23" fill="#FFFFFF" stroke="#E3E6EC"/>
    <text x="350" y="447">local-first</text>
    <rect x="510" y="418" width="146" height="46" rx="23" fill="#FFFFFF" stroke="#E3E6EC"/>
    <text x="532" y="447">MCP stdio</text>
    <rect x="672" y="418" width="262" height="46" rx="23" fill="#FFFFFF" stroke="#E3E6EC"/>
    <text x="694" y="447">5 agents · 1,676 messages</text>
  </g>

  <text x="1184" y="584" text-anchor="end" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="20" fill="#8A91A4">polaris-smart/agent-mailbox</text>
</svg>
