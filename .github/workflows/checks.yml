name: Independent v0.8 checks
on:
  workflow_call:
    inputs:
      targets:
        description: Explicit runner, OS and CPU architecture for each native target
        type: string
        default: '[{"runner":"macos-15","platform":"darwin","arch":"arm64"},{"runner":"macos-15-intel","platform":"darwin","arch":"x64"},{"runner":"windows-2025","platform":"win32","arch":"x64"},{"runner":"ubuntu-24.04","platform":"linux","arch":"x64"}]'
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      AGENT_MAILBOX_TEST_RUNTIME_DIR: ${{ github.workspace }}/src/agent_mailbox/runtime_bridge
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: src/agent_mailbox/runtime_bridge/package-lock.json
      - name: Verify native Python and Node architecture
        run: python scripts/check-ci-platform.py --platform ${{ matrix.target.platform }} --arch ${{ matrix.target.arch }} --output "${{ runner.temp }}/platform.json"
      - name: Generate source build provenance
        run: python -c "import runpy; runpy.run_path('scripts/build-workbench.py')['write_build_info']()"
      - name: Install independent Python package
        run: python -m pip install -e ".[dev]"
      - name: Install locked execution dependencies
        working-directory: src/agent_mailbox/runtime_bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Repository hygiene (credentials/sessions/private data)
        run: python scripts/check-hygiene.py
      - name: Verify TCP and pinned TLS claim cancellation
        run: python -m pytest tests/test_workbench_fleet.py -k "test_stop_interrupts_claim_response_after_http_connection_releases_socket or test_stop_interrupts_real_tls_close_response_and_preserves_control" -v --tb=short
      - name: Run full regression and preserve diagnostics
        shell: bash
        run: |
          python - <<'PYTHON'
          import os, pathlib, subprocess, sys
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pytest.log"
          try:
              with log.open("wb") as target:
                  result = subprocess.run([sys.executable, "-m", "pytest", "-o", "addopts=--timeout=30", "-vv", "--tb=short"], stdout=target, stderr=subprocess.STDOUT, timeout=900)
              code = result.returncode
          except subprocess.TimeoutExpired:
              code = 124
              print("Regression process exceeded the 15-minute hard deadline.")
          print(log.read_text(encoding="utf-8", errors="replace"))
          sys.exit(code)
          PYTHON
      - name: Preserve regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.target.runner }}-${{ matrix.python }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/platform.json
  native-package:
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: src/agent_mailbox/runtime_bridge/package-lock.json
      - name: Verify native Python and Node architecture
        run: python scripts/check-ci-platform.py --platform ${{ matrix.target.platform }} --arch ${{ matrix.target.arch }} --output "${{ runner.temp }}/platform.json"
      - name: Generate source build provenance
        run: python -c "import runpy; runpy.run_path('scripts/build-workbench.py')['write_build_info']()"
      - name: Statically link OpenSSL for the Intel macOS package
        if: matrix.target.platform == 'darwin' && matrix.target.arch == 'x64'
        shell: bash
        run: |
          OPENSSL_STATIC=1 OPENSSL_DIR="$(brew --prefix openssl@3)" python -m pip install --force-reinstall --no-cache-dir --no-binary=cryptography "cryptography>=46,<51"
      - name: Install package builder
        run: python -m pip install ".[desktop]" pyinstaller==6.22.0
      - name: Install pinned runtime
        working-directory: src/agent_mailbox/runtime_bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build on native host
        shell: bash
        run: |
          python scripts/build-workbench.py --runtime-dir src/agent_mailbox/runtime_bridge --node-binary "$(which node)" --output-dir "$RUNNER_TEMP/native-package" > "$RUNNER_TEMP/native-build.log" 2>&1
      - name: Launch extracted package and verify real HTTP and MCP
        shell: bash
        run: |
          python scripts/check-ci-platform.py --platform ${{ matrix.target.platform }} --arch ${{ matrix.target.arch }} --manifest "$RUNNER_TEMP/native-package/build-manifest.json" --output "$RUNNER_TEMP/native-package/platform.json"
          python scripts/check-package.py --manifest "$RUNNER_TEMP/native-package/build-manifest.json" --output "$RUNNER_TEMP/native-package/package-check.json"
      - name: Preserve package verification and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-package-${{ matrix.target.runner }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/native-package/archives/*
            ${{ runner.temp }}/native-package/build-manifest.json
            ${{ runner.temp }}/native-package/package-check.json
            ${{ runner.temp }}/native-package/platform.json
            ${{ runner.temp }}/platform.json
            ${{ runner.temp }}/native-build.log
