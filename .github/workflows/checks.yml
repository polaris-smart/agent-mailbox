name: Independent v0.8 checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      AGENT_MAILBOX_TEST_RUNTIME_DIR: src/agent_mailbox/runtime_bridge
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: src/agent_mailbox/runtime_bridge/package-lock.json
      - name: Install independent Python package
        run: python -m pip install -e ".[dev]"
      - name: Install locked execution dependencies
        working-directory: src/agent_mailbox/runtime_bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -o addopts="--timeout=30" -q
