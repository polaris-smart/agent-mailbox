name: Publish independent v0.8
on:
  push:
    tags: ["v0.8.*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check release version
        run: |
          python - <<'PYTHON'
          import os, tomllib
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          assert version.startswith("0.8."), "This is the independent v0.8 release line"
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/"):
              assert ref.removeprefix("refs/tags/v") == version, "Tag/package version mismatch"
          PYTHON
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    if: startsWith(github.ref, 'refs/tags/v0.8.')
    needs: [build, checks]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
