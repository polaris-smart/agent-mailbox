[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mailbox-mcp"
version = "0.1.0"
description = "Give every local AI agent its own mailbox — one MCP server, register once, message any agent on this machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NoFox Team" }]
keywords = ["mcp", "agent", "mailbox", "multi-agent", "local-first", "message"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.4", "ruff>=0.6"]

[project.scripts]
agent-mailbox = "agent_mailbox.server:main"
agent-mailbox-watch = "agent_mailbox.watch:main"

[project.urls]
Homepage = "https://github.com/polaris-smart/agent-mailbox"
Issues = "https://github.com/polaris-smart/agent-mailbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mailbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=30"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
