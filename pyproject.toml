[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mailbox"
version = "0.8.2"
description = "Local-first AI agent team workbench: project-scoped MCP mailboxes for existing apps and CLIs, shared context, task handoffs and human review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "polaris-smart", email = "286855282+polaris-smart@users.noreply.github.com" }]
keywords = ["ai-agents", "agent-collaboration", "multi-agent", "mcp", "codex", "claude-code", "local-first", "agent-workbench", "mailbox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp>=2.1", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.4", "ruff>=0.16.6,<0.17.0", "tinycss2>=1.4,<2"]
desktop = [
  "pyobjc-core>=12.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=12.0; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=12.0; sys_platform == 'darwin'",
]
[project.scripts]
agent-mailbox = "agent_mailbox.cli:main"

[project.urls]
Homepage = "https://github.com/polaris-smart/agent-mailbox"
Issues = "https://github.com/polaris-smart/agent-mailbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mailbox"]


# **构建溯源** ✓（Codex 缺口 ③）：`build-info.json` 在 `.gitignore` 里 ⇒ 按 VCS 选文件会漏 ✗
# ⇒ 显式 force-include ✓ 让 wheel 也带 revision/dirty（**必须放在本段 keys 之后** ✗ 否则会吞掉 packages ✓）
[tool.hatch.build.targets.wheel.force-include]
"src/agent_mailbox/workbench_assets/build-info.json" = "agent_mailbox/workbench_assets/build-info.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=30"
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/README.zh-CN.md",
  "/LICENSE", "/NOTICE", "/LICENSES", "/PRODUCT.md", "/DESIGN.md", "/SECURITY.md", "/CHANGELOG.md", "/docs/PRD.md",
  "/docs/RELEASE-081.md", "/docs/RELEASE-082.md", "/docs/WORKBENCH.md", "/docs/GITHUB-QUICKSTART.md", "/docs/NODES.md",
  "/docs/HANDOVER-CODEX.md", "/docs/archive/v07/PRD.md", "/docs/reviews/2026-09-30-v080-independence.md",
  "/docs/designs/2026-09-30-v080-independent.md", "/docs/designs/2026-09-30-connection-guidance.md", "/docs/designs/2026-09-30-employee-cards-mailboxes.md", "/docs/evidence/v080/employee-cards-mailboxes.md", "/docs/evidence/v080/connection-guidance.md", "/docs/designs/v080-packaging.md",
  "/docs/evidence/v080-independent", "/scripts/build-workbench.py", "/scripts/release-workbench.py",
  "/scripts/check-ci-platform.py",
  "/scripts/RELEASE-workbench.md", "/scripts/check-package.py", "/docs/RELEASE-CHANNELS.md", "/docs/BETA-INSTALL.md", "/docs/designs/2026-10-01-unified-beta4-release.md", "/docs/evidence/v080/windows-private-permissions.md", "/docs/evidence/v080/windows-runtime-fixture.md", "/docs/evidence/v080/windows-git-policy.md", "/docs/evidence/v080/beta4-release.md", "/scripts/check-node-beta.py", "/docs/BETA-ACCEPTANCE.md", "/docs/evidence/v080/beta1.md", "/docs/evidence/v080/beta2-updates.md", "/docs/designs/2026-10-01-update-beta2.md",
  "/docs/designs/2026-10-01-existing-session-mailbox.md", "/docs/designs/2026-10-01-beta3-onboarding-delivery.md", "/docs/evidence/v080/beta3-collaboration.md",
]

[tool.hatch.build.targets.sdist.force-include]
"src/agent_mailbox/workbench_assets/build-info.json" = "src/agent_mailbox/workbench_assets/build-info.json"
