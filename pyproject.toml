[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mailbox"
version = "0.8.0a8"
description = "Manage AI employees, project work and shared knowledge locally, with optional paired execution nodes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NoFox and contributors" }]
keywords = ["mcp", "agent", "mailbox", "multi-agent", "local-first", "workbench"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["mcp>=2.1", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.4", "ruff>=0.16.6,<0.17.0"]
[project.scripts]
agent-mailbox = "agent_mailbox.cli:main"

[project.urls]
Homepage = "https://github.com/polaris-smart/agent-mailbox"
Issues = "https://github.com/polaris-smart/agent-mailbox/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mailbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=30"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/README.zh-CN.md",
  "/LICENSE", "/NOTICE", "/LICENSES", "/PRODUCT.md", "/DESIGN.md", "/SECURITY.md", "/CHANGELOG.md", "/docs/PRD.md",
  "/docs/WORKBENCH.md", "/docs/GITHUB-QUICKSTART.md", "/docs/NODES.md",
  "/docs/HANDOVER-CODEX.md", "/docs/archive/v07/PRD.md", "/docs/reviews/2026-09-30-v080-independence.md",
  "/docs/designs/2026-09-30-v080-independent.md", "/docs/designs/2026-09-30-connection-guidance.md", "/docs/designs/2026-09-30-employee-cards-mailboxes.md", "/docs/evidence/v080/employee-cards-mailboxes.md", "/docs/evidence/v080/connection-guidance.md", "/docs/designs/v080-packaging.md",
  "/docs/evidence/v080-independent", "/scripts/build-workbench.py", "/scripts/release-workbench.py",
  "/scripts/RELEASE-workbench.md",
]
